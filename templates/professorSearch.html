<!doctype html>
<html>
<head>
    <title>ProfessorSearch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
            color: #222;
        }

        .page-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .form-input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .search-button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .search-button:hover {
            background-color: #005fcc;
        }

        .professor-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .professor-table th {
            background-color: #1f2937;
            color: white;
            text-align: left;
            padding: 14px 16px;
            font-weight: 600;
        }

        .professor-table td {
            padding: 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .professor-table tr:last-child td {
            border-bottom: none;
        }

        .professor-table tbody tr {
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .professor-table tbody tr:hover {
            background-color: #eef5ff;
        }

        .professor-table tbody tr:hover a {
            color: #005fcc;
            text-decoration: underline;
        }

        .table-link {
            display: block;
            padding: 14px 16px;
            color: #222;
            text-decoration: none;
        }

        .click-hint {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="page-container">

        <form method="GET" action="/professorSearch" class="search-form">
            <input 
                type="text" 
                name="professor_name" 
                placeholder="Search for professor by name" 
                class="form-input"
            >

            <button type="submit" class="search-button">
                Search
            </button>
        </form>

        <p class="click-hint">Click on a row to open the professor.</p>

        <table class="professor-table">
            <thead>
                <tr>
                    <th>Professor</th>
                    <th>Grade average</th>
                    <th>Pass percentage</th>
                </tr>
            </thead>

            <tbody>
                {% for professor in professors %}
                    <tr>
                        <td>
                            <a href="/courseList?professor_id={{professor[0]}}" class="table-link">
                                {{ professor[1] }}
                            </a>
                        </td>

                        <td>
                            <a href="/hej" class="table-link">
                                {{ professor[2] }}
                            </a>
                        </td>

                        <td>
                            <a href="/hej" class="table-link">
                                {{ professor[3] }}%
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</body>
</html>
